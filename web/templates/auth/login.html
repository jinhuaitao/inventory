{{define "content"}}
<div class="auth-card">
  <h2 class="auth-title">登录</h2>
  <p class="auth-subtitle">使用您的账号继续访问库存管理系统</p>

  {{with index .Data.Errors "form"}}
  <div class="alert alert-error">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><circle cx="12" cy="16" r="0.9" fill="currentColor" stroke="none"/></svg>
    <span>{{.}}</span>
  </div>
  {{end}}

  <form method="post" action="/login" class="form" novalidate>
    <input type="hidden" name="_csrf" value="{{.CSRF}}">
    <input type="hidden" name="next" value="{{.Data.Next}}">

    <div class="field">
      <label for="identifier">用户名或邮箱</label>
      <input type="text" id="identifier" name="identifier"
             value="{{index .Data.Values "identifier"}}"
             class="input {{if index .Data.Errors "identifier"}}is-invalid{{end}}"
             placeholder="请输入用户名或邮箱"
             autocomplete="username" required autofocus>
      {{with index .Data.Errors "identifier"}}<p class="field-error">{{.}}</p>{{end}}
    </div>

    <div class="field">
      <label for="password">密码</label>
      <div class="input-group">
        <input type="password" id="password" name="password"
               class="input {{if index .Data.Errors "password"}}is-invalid{{end}}"
               placeholder="请输入密码"
               autocomplete="current-password" required>
        <button type="button" class="input-suffix" data-toggle-password="password">显示</button>
      </div>
      {{with index .Data.Errors "password"}}<p class="field-error">{{.}}</p>{{end}}
    </div>

    <div class="field-row">
      <label class="checkbox">
        <input type="checkbox" name="remember" value="1">
        <span>记住我（30 天内免登录）</span>
      </label>
      <a href="/forgot-password" class="link">忘记密码？</a>
    </div>

    <button type="submit" class="btn btn-primary btn-block">登录</button>
  </form>

  {{if .AllowRegistration}}
  <p class="auth-switch">还没有账号？<a href="/register" class="link">立即注册</a></p>
  {{else}}
  <p class="auth-switch">系统已关闭自助注册，请联系管理员开通账号。</p>
  {{end}}
</div>
{{end}}
