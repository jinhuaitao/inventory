{{define "content"}}
<div class="error-page">
  <div class="error-code danger">500</div>
  <h2 class="error-title">服务器开小差了</h2>
  <p class="error-desc">
    系统在处理请求时遇到了问题，错误详情已记录到服务端日志。<br>
    请稍后重试，如果问题持续存在，请联系管理员。
  </p>
  <div class="error-actions">
    <a href="/" class="btn btn-primary">返回首页</a>
    {{/* 「返回上一页」不能使用 javascript 伪协议：站点 CSP 为 script-src 'self'，
       伪协议同样会被拦掉，点了没有任何反应。 */}}
    <button type="button" class="btn btn-outline" data-history-back>返回上一页</button>
  </div>
</div>
{{end}}
