{{define "sidebar"}}
<aside class="sidebar" id="sidebar">
  <a href="/" class="sidebar-brand">
    <span class="brand-mark">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v9"/></svg>
    </span>
    <span class="brand-text">{{.AppName}}</span>
  </a>

  <nav class="sidebar-nav">
    <a href="/" class="nav-item {{if eq .Active "dashboard"}}active{{end}}">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
      <span>仪表盘</span>
    </a>

    <div class="nav-group">基础数据</div>

    <a href="/products" class="nav-item {{if eq .Active "products"}}active{{end}}">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/></svg>
      <span>商品管理</span>
    </a>

    <a href="/categories" class="nav-item {{if eq .Active "categories"}}active{{end}}">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A2.5 2.5 0 015.5 5H9l2 2.5h7.5A2.5 2.5 0 0121 10v7a2.5 2.5 0 01-2.5 2.5h-13A2.5 2.5 0 013 17V7.5z"/></svg>
      <span>分类管理</span>
    </a>

    <a href="/suppliers" class="nav-item {{if eq .Active "suppliers"}}active{{end}}">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4h13v12H1z"/><path d="M14 8h4l3 3.5V16h-7z"/><circle cx="5.5" cy="18.5" r="1.8"/><circle cx="17.5" cy="18.5" r="1.8"/></svg>
      <span>供应商</span>
    </a>

    <div class="nav-group">库存作业</div>

    {{if .User.Role.CanWrite}}
    <a href="/stock/in" class="nav-item {{if eq .Active "stock-in"}}active{{end}}">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v9"/><path d="M8 8l4 4 4-4"/><path d="M3 15v4a2 2 0 002 2h14a2 2 0 002-2v-4"/></svg>
      <span>商品入库</span>
    </a>

    <a href="/stock/out" class="nav-item {{if eq .Active "stock-out"}}active{{end}}">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 13V4"/><path d="M8 8l4-4 4 4"/><path d="M3 15v4a2 2 0 002 2h14a2 2 0 002-2v-4"/></svg>
      <span>商品出库</span>
    </a>

    <a href="/stock/adjust" class="nav-item {{if eq .Active "stock-adjust"}}active{{end}}">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h11M9 12h11M9 19h11"/><path d="M3 5l1.4 1.4L7 4"/><path d="M3 12l1.4 1.4L7 11"/><path d="M3 19l1.4 1.4L7 18"/></svg>
      <span>库存盘点</span>
    </a>
    {{end}}

    <a href="/stock/movements" class="nav-item {{if eq .Active "movements"}}active{{end}}">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1.2" fill="currentColor" stroke="none"/><circle cx="3.5" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="3.5" cy="18" r="1.2" fill="currentColor" stroke="none"/></svg>
      <span>库存流水</span>
    </a>

    <a href="/stock/low" class="nav-item {{if eq .Active "low-stock"}}active{{end}}">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l9.2 16H2.8l9.2-16z"/><path d="M12 9.5v4.5"/><circle cx="12" cy="16.8" r="0.9" fill="currentColor" stroke="none"/></svg>
      <span>库存预警</span>
    </a>

    <div class="nav-group">分析与管理</div>

    <a href="/reports" class="nav-item {{if eq .Active "reports"}}active{{end}}">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V11"/><path d="M10 20V4"/><path d="M16 20v-6"/><path d="M22 20H2"/></svg>
      <span>库存报表</span>
    </a>

    {{if .User.Role.CanManageUsers}}
    <a href="/users" class="nav-item {{if eq .Active "users"}}active{{end}}">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.6 20a7.4 7.4 0 0114.8 0"/></svg>
      <span>用户管理</span>
    </a>

    <a href="/admin/update" class="nav-item {{if eq .Active "update"}}active{{end}}">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-3.2-6.9"/><path d="M21 4v5h-5"/></svg>
      <span>系统更新</span>
    </a>

    <a href="/admin/maintenance" class="nav-item {{if eq .Active "maintenance"}}active{{end}}">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5.5" rx="7.5" ry="3"/><path d="M4.5 5.5v13c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-13"/><path d="M4.5 12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3"/></svg>
      <span>数据维护</span>
    </a>
    {{end}}
  </nav>

  <div class="sidebar-foot">
    <span class="env-badge">{{.Env}}</span>
  </div>
</aside>
{{end}}
