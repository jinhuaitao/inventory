{{define "content"}}
<div class="page page-narrow">

  <div class="page-head">
    <div>
      <h2 class="page-title">修改密码</h2>
      <p class="page-desc">修改成功后，其它设备上的登录状态将立即失效。</p>
    </div>
    <div class="page-actions">
      <a href="/profile" class="btn btn-ghost">返回个人资料</a>
    </div>
  </div>

  {{with index .Data.Errors "form"}}
  <div class="alert alert-error"><span>{{.}}</span></div>
  {{end}}

  <form method="post" action="/profile/password" class="card form">
    <input type="hidden" name="_csrf" value="{{.CSRF}}">

    <div class="card-body">
      <div class="field">
        <label for="current_password">当前密码 <span class="req">*</span></label>
        <div class="input-group">
          <input type="password" id="current_password" name="current_password"
                 class="input {{if index .Data.Errors "current_password"}}is-invalid{{end}}"
                 autocomplete="current-password" required autofocus>
          <button type="button" class="input-suffix" data-toggle-password="current_password">显示</button>
        </div>
        {{with index .Data.Errors "current_password"}}<p class="field-error">{{.}}</p>{{end}}
      </div>

      <div class="field">
        <label for="password">新密码 <span class="req">*</span></label>
        <div class="input-group">
          <input type="password" id="password" name="password"
                 class="input {{if index .Data.Errors "password"}}is-invalid{{end}}"
                 placeholder="至少 8 位，需包含字母和数字"
                 autocomplete="new-password" required data-strength-input>
          <button type="button" class="input-suffix" data-toggle-password="password">显示</button>
        </div>
        <div class="strength" data-strength-meter>
          <span class="strength-seg"></span>
          <span class="strength-seg"></span>
          <span class="strength-seg"></span>
          <span class="strength-seg"></span>
          <span class="strength-label"></span>
        </div>
        {{with index .Data.Errors "password"}}<p class="field-error">{{.}}</p>{{end}}
      </div>

      <div class="field">
        <label for="password_confirm">确认新密码 <span class="req">*</span></label>
        <div class="input-group">
          <input type="password" id="password_confirm" name="password_confirm"
                 class="input {{if index .Data.Errors "password_confirm"}}is-invalid{{end}}"
                 autocomplete="new-password" required>
          <button type="button" class="input-suffix" data-toggle-password="password_confirm">显示</button>
        </div>
        {{with index .Data.Errors "password_confirm"}}<p class="field-error">{{.}}</p>{{end}}
      </div>
    </div>

    <div class="card-foot form-actions">
      <a href="/profile" class="btn btn-ghost">取消</a>
      <button type="submit" class="btn btn-primary">确认修改</button>
    </div>
  </form>

</div>
{{end}}
