{{define "content"}}
<div class="page page-narrow">

  <div class="page-head">
    <div>
      <h2 class="page-title">{{if .Data.IsEdit}}编辑供应商{{else}}新建供应商{{end}}</h2>
      <p class="page-desc">记录供应商联系方式，便于采购与对账。</p>
    </div>
    <div class="page-actions">
      <a href="/suppliers" class="btn btn-ghost">返回列表</a>
    </div>
  </div>

  {{with index .Data.Errors "form"}}
  <div class="alert alert-error"><span>{{.}}</span></div>
  {{end}}

  <form method="post" action="{{if .Data.IsEdit}}/suppliers/{{.Data.Supplier.ID}}{{else}}/suppliers{{end}}" class="card form">
    <input type="hidden" name="_csrf" value="{{.CSRF}}">

    <div class="card-body">
      <div class="form-grid">
        <div class="field span-2">
          <label for="name">供应商名称 <span class="req">*</span></label>
          <input type="text" id="name" name="name" value="{{index .Data.Values "name"}}"
                 class="input {{if index .Data.Errors "name"}}is-invalid{{end}}"
                 placeholder="例如 深圳市宏远电子有限公司" required autofocus>
          {{with index .Data.Errors "name"}}<p class="field-error">{{.}}</p>{{end}}
        </div>

        <div class="field">
          <label for="contact_person">联系人</label>
          <input type="text" id="contact_person" name="contact_person"
                 value="{{index .Data.Values "contact_person"}}" class="input" placeholder="例如 张伟">
        </div>

        <div class="field">
          <label for="phone">联系电话</label>
          <input type="text" id="phone" name="phone" value="{{index .Data.Values "phone"}}"
                 class="input" placeholder="例如 0755-88886666">
        </div>

        <div class="field span-2">
          <label for="email">邮箱</label>
          <input type="email" id="email" name="email" value="{{index .Data.Values "email"}}"
                 class="input {{if index .Data.Errors "email"}}is-invalid{{end}}"
                 placeholder="例如 sales@example.com">
          {{with index .Data.Errors "email"}}<p class="field-error">{{.}}</p>{{end}}
        </div>

        <div class="field span-2">
          <label for="address">地址</label>
          <input type="text" id="address" name="address" value="{{index .Data.Values "address"}}"
                 class="input" placeholder="例如 广东省深圳市南山区科技园">
        </div>

        <div class="field span-2">
          <label for="note">备注</label>
          <textarea id="note" name="note" rows="3" class="input textarea"
                    placeholder="选填，例如结算方式、供货周期">{{index .Data.Values "note"}}</textarea>
        </div>
      </div>
    </div>

    <div class="card-foot form-actions">
      <a href="/suppliers" class="btn btn-ghost">取消</a>
      <button type="submit" class="btn btn-primary">{{if .Data.IsEdit}}保存修改{{else}}创建供应商{{end}}</button>
    </div>
  </form>

</div>
{{end}}
