{{define "content"}}
<div class="page page-narrow">

  <div class="page-head">
    <div>
      <h2 class="page-title">库存盘点</h2>
      <p class="page-desc">
        盘点后直接把系统库存修正为实际盘点数量。系统会记录盘盈 / 盘亏差异，便于后续追溯。
      </p>
    </div>
    <div class="page-actions">
      <a href="/stock/movements?type=adjust" class="btn btn-ghost">盘点记录</a>
    </div>
  </div>

  {{with index .Data.Errors "form"}}
  <div class="alert alert-error">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/></svg>
    <span>{{.}}</span>
  </div>
  {{end}}

  <form method="post" action="/stock/adjust" class="card form" id="stockForm">
    <input type="hidden" name="_csrf" value="{{.CSRF}}">

    <div class="card-body">
      <div class="form-grid">
        <div class="field span-2">
          <label for="product_id">选择商品 <span class="req">*</span></label>
          {{$preset := .Data.PresetID}}
          {{$selected := index .Data.Values "product_id"}}
          <select id="product_id" name="product_id" class="select" required data-product-select autofocus>
            <option value="">请选择商品</option>
            {{range .Data.Products}}
            <option value="{{.ID}}"
                    data-qty="{{.Quantity}}" data-unit="{{.Unit}}"
                    data-cost="{{float .CostPrice 2}}" data-sale="{{float .SalePrice 2}}"
                    data-safety="{{.SafetyStock}}"
                    {{if or (eq $preset .ID) (eq $selected (printf "%d" .ID))}}selected{{end}}>
              {{.SKU}} · {{.Name}}（系统库存 {{.Quantity}} {{.Unit}}）
            </option>
            {{end}}
          </select>
          <p class="field-hint" data-product-hint></p>
        </div>

        <div class="field">
          <label for="actual_quantity">实际盘点数量 <span class="req">*</span></label>
          <input type="number" id="actual_quantity" name="actual_quantity" min="0" step="1"
                 value="{{index .Data.Values "actual_quantity"}}" class="input" required>
          <p class="field-hint" data-qty-hint></p>
        </div>

        <div class="field">
          <label>差异预览</label>
          <div class="diff-preview" data-diff-preview>—</div>
        </div>

        <div class="field span-2">
          <label for="note">盘点说明</label>
          <textarea id="note" name="note" rows="2" class="input textarea"
                    placeholder="选填，例如盘点日期、差异原因">{{index .Data.Values "note"}}</textarea>
        </div>
      </div>

      <div class="alert alert-info">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="8" r="0.9" fill="currentColor" stroke="none"/></svg>
        <span>盘点会直接覆盖系统库存，请确认实际数量准确无误。</span>
      </div>
    </div>

    <div class="card-foot form-actions">
      <a href="/products" class="btn btn-ghost">取消</a>
      <button type="submit" class="btn btn-primary">提交盘点结果</button>
    </div>
  </form>

</div>
{{end}}
